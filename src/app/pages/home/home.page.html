<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gallery</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="showSortOptions()">
        <ion-icon slot="icon-only" name="funnel"></ion-icon>
      </ion-button>
      <ion-button routerLink="/albums">
        <ion-icon slot="icon-only" name="albums"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gallery</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="photo-grid" *ngIf="photos.length > 0">
    <ion-card *ngFor="let photo of photos" (click)="showPhotoActions(photo)">
      <img [src]="photo.webviewPath" />
      <ion-card-content>
        <p class="photo-date">{{ photo.dateTaken | date:'short' }}</p>
      </ion-card-content>
    </ion-card>
  </div>

  <div class="empty-state" *ngIf="photos.length === 0">
    <ion-icon name="images-outline"></ion-icon>
    <h2>No Photos Yet</h2>
    <p>Start by adding your first photo!</p>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
