<ion-content [fullscreen]="true" class="viewer-content" (click)="onStageClick()">
  <main class="viewer-stage" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
    <img
      *ngIf="currentPhoto"
      [src]="currentPhoto.webviewPath"
      [alt]="currentPhoto.name"
      class="media-content"
      draggable="false"
    />

    <img
      *ngIf="currentMedia?.type === 'image'"
      [src]="mediaSourceUrl"
      [alt]="currentMedia.name"
      class="media-content"
      draggable="false"
      (error)="onFullImageError()"
    />

    <video
      *ngIf="currentMedia?.type === 'video'"
      [src]="mediaSourceUrl"
      [poster]="thumbnailUrl || null"
      class="media-content video-content"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      (click)="$event.stopPropagation()"
      (error)="onVideoError()"
    ></video>

    <div class="playback-error" *ngIf="playbackError">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <span>This video could not be opened. The file may be unavailable or use an unsupported format.</span>
    </div>
  </main>

  <div class="viewer-chrome" [class.controls-hidden]="!showControls">
    <header class="viewer-topbar">
      <button class="chrome-button close-button" aria-label="Back to gallery" (click)="close(); $event.stopPropagation()">
        <ion-icon name="arrow-back"></ion-icon>
      </button>
      <div class="topbar-title">
        <h1>{{ currentPhoto?.name || currentMedia?.name || 'Media' }}</h1>
      <span>{{ mediaCounter }}</span>
      </div>
      <span class="media-type-badge" *ngIf="currentMedia?.type === 'video'">
        <ion-icon name="videocam-outline"></ion-icon> VIDEO
      </span>
      <button class="chrome-button menu-button" aria-label="Media options" (click)="showMediaMenu(); $event.stopPropagation()">
        <ion-icon name="ellipsis-vertical"></ion-icon>
      </button>
    </header>
  </div>
</ion-content>
