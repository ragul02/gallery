<ion-header class="gallery-header viewer-gallery-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="toolbar-action" aria-label="Back to gallery" (click)="close()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <div class="brand-mark viewer-brand" slot="start" aria-hidden="true"><ion-icon name="images"></ion-icon></div>
    <ion-title>
      <div class="viewer-nav-title">{{ currentPhoto?.name || currentMedia?.name || 'Media' }}<small>{{ mediaCounter }}</small></div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button class="toolbar-action" aria-label="Media options" (click)="showMediaMenu()">
        <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="viewer-content">
  <main class="viewer-stage" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
    <img
      *ngIf="currentPhoto"
      [src]="currentPhoto.webviewPath"
      [alt]="currentPhoto.name"
      class="media-content"
      draggable="false"
    />

    <img
      *ngIf="currentMedia?.type === 'image'"
      [src]="mediaSourceUrl"
      [alt]="currentMedia.name"
      class="media-content"
      draggable="false"
      (error)="onFullImageError()"
    />

    <video
      *ngIf="currentMedia?.type === 'video'"
      [src]="mediaSourceUrl"
      [poster]="thumbnailUrl || null"
      class="media-content video-content"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      (click)="$event.stopPropagation()"
      (error)="onVideoError()"
    ></video>

    <div class="playback-error" *ngIf="playbackError">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <span>This video could not be opened. The file may be unavailable or use an unsupported format.</span>
    </div>
  </main>

</ion-content>
